name: CI

# The verification job. Runs on every push and every pull request, including
# main — the README badge reads the latest run on the default branch, so a
# workflow that skipped main would show a permanently stale badge.
#
# This overlaps with the build step of the deploy workflow, deliberately: the
# deploy answers "did it ship", this answers "is the code sound", and the badge
# next to the project description should mean the second one.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung install or test would hold this runner and the badge for hours;
    # the whole suite takes under a minute, so ten is generous.
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs, not tags: a tag is a pointer the action's owner
      # can move, and a moved tag would run different code with the same name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
      # when package.json and the lock have drifted, which is the check that
      # keeps CI from testing a dependency tree nobody else will ever get.
      # `--ignore-scripts` closes the other half: a PR that edits the lockfile
      # could otherwise run an install script on the runner. Nothing in this
      # tree needs one — build and tests pass with scripts off — and the day a
      # dependency does need one, this step fails loudly instead of silently
      # executing it.
      - name: Install
        run: npm ci --ignore-scripts

      # Lint before typecheck: it is the fastest gate and catches the things tsc
      # deliberately does not — a hook dependency that lies, a variable nobody uses.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The security tests run before the build: they are fast, and a renderer
      # that hands a `javascript:` URL to the browser is a worse outcome than a
      # bundle that fails to compile.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build output is a static site with no dependencies at runtime.
      # If it is missing the script or the stylesheet, the deploy would ship a
      # blank page and nothing above would have noticed.
      - name: Check the bundle is complete
        run: |
          test -f dist/index.html
          grep -q './assets/' dist/index.html
          ls dist/assets/*.js dist/assets/*.css

  # happy-dom is a good approximation, not a browser. This job answers the
  # questions only Chromium can: does it paint, does the CSP allow what the app
  # does, does a click work after layout, is the console quiet. The API is
  # intercepted inside e2e/smoke.mjs, so the run is deterministic.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # The browser download is the slowest step in this job, and it only
      # changes when Playwright pins a new browser revision — that pin lives in
      # playwright-core/browsers.json. Keying on the whole lockfile would throw
      # the cache away on every unrelated dependency bump.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium and its libraries
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (cached)
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Browser smoke
        run: npm run e2e

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke
          path: artifacts/
          if-no-files-found: warn
