name: CodeQL

# Static analysis for security bugs. Free for public repositories, unavailable
# on a private repository without GitHub Advanced Security — so, exactly like
# the Pages deploy, this is gated on visibility rather than left to fail with a
# red X on every push. The day the repository becomes public, this starts
# working with no edit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published CodeQL query finds old code too.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript-typescript
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Only what the analysis needs: read the code, write the findings.
      # No write access to contents — this job never modifies the repository.
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # `security-extended` is the query set that includes the stricter
          # checks; for an app that renders untrusted README text, the extra
          # injection queries are the reason this workflow exists.
          queries: security-extended

      # No build step: CodeQL analyses JavaScript and TypeScript from source.
      # Running the bundler first would only add noise and time.

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
