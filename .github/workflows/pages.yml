name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo, publish an artifact, and mint an OIDC token
# for the deploy step. Granting anything wider would be unnecessary authority
# for a job whose only output is static files.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` is deliberate: a
# half-cancelled Pages deploy can leave the environment pointing at an
# artifact that never finished uploading.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Same reasoning as CI: a hung build must fail, not occupy a runner.
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs, not tags: a moved tag would run different code
      # under the same name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is the check
      # that keeps a deploy from silently building different code than CI saw.
      # `--ignore-scripts` for the same reason as in CI: a lockfile edit must
      # not be able to run code on the runner that publishes the site.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # CI and this workflow both trigger on a push to main and run in parallel,
      # so a red CI cannot stop a deploy that started at the same second. Running
      # the tests here is what makes them a gate for what actually gets published,
      # rather than a signal that arrives after the artifact is live.
      - name: Test
        run: npm test

      # Always runs. Whether or not this repository can publish a Pages site,
      # "does the code build" is a question CI should answer on every push —
      # so the build stays unconditional and only the publishing is gated.
      - name: Build
        run: npm run build

      # GitHub Pages for a *private* repository needs Pro/Team/Enterprise. On
      # the Free plan the Pages API answers 404 and configure-pages fails the
      # whole run — a red X on every push to main that says "deploy broken"
      # when the truth is "not available on this plan yet". Gating on
      # visibility keeps the signal honest: while private, this job verifies
      # the build and stops; once the repository is public, it deploys with no
      # further edit. `enablement: true` is deliberately NOT used: it would
      # try to switch Pages on by itself, and that is the owner's call.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.event.repository.visibility == 'public'
        id: pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event.repository.visibility == 'public'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
