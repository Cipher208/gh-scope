version: 2

updates:
  # The app's own dependencies. Grouped into one pull request per week: this is
  # a small project, and six separate PRs for six patch bumps is noise that
  # trains a maintainer to ignore Dependabot entirely.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major bumps stay separate and deliberate. React 19, Tailwind 5 and Vite 7
    # are not "update the lockfile" — they are migrations that need reading.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The workflows pin actions by major tag; this keeps those tags current and
  # surfaces a deprecation before GitHub turns it into a red build.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
