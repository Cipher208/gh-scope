<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages cannot send headers, so the policy has to travel as a meta
         tag. Two consequences worth naming: `frame-ancestors` is ignored in
         meta (clickjacking protection needs a header this host will not send),
         and `style-src` needs 'unsafe-inline' because React writes style
         attributes at runtime (language bars, progress fills). Scripts are the
         part that matters: `script-src 'self'`, no inline blocks, no eval. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <!-- No Cache-Control meta here on purpose. Browsers only honour a meta
         http-equiv for a short list of names and Cache-Control is not one of
         them, so these two lines read as a cache policy while doing nothing.
         GitHub Pages cannot send custom headers either. Dead markup that looks
         load-bearing is worse than no markup. -->
    <meta
      name="description"
      content="gh-scope — universal GitHub search & explorer: profiles, orgs, repo duels, trending, releases and deep repo cards."
    />
    <title>gh-scope · universal GitHub search & explorer</title>
    <!-- One page, one address. The canonical is absolute on purpose: relative
         canonicals are the ones crawlers mishandle under a project path. -->
    <link rel="canonical" href="https://cipher208.github.io/gh-scope/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cipher208.github.io/gh-scope/" />
    <meta property="og:title" content="gh-scope · universal GitHub search & explorer" />
    <meta
      property="og:description"
      content="Profiles, orgs, repo duels, trending and releases — one static page, no backend, no secrets."
    />
    <!-- Relative, like every other asset: the bundle has to work under a
         project subdirectory (github.io/gh-scope/) as well as at a root. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Paints the mobile browser chrome in the app's own dark, and only asks
         for the dark value: the page can switch themes after load, but the
         toolbar is decided before CSS runs. -->
    <meta name="theme-color" content="#0c1420" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
